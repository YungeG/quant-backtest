[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-bundle-builder"
version = "0.1.0"
description = "Offline source-to-immutable-market-bundle builder"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crypto-quant-domain",
  "crypto-quant-market-data",
]

[tool.uv.sources]
crypto-quant-domain = { workspace = true }
crypto-quant-market-data = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
